  <!-- React chunk cache cleanup -->
  <!-- React chunk cache cleanup -->
  <script>
    (async function () {
      try {
        // Get the current list of React chunks in the document
        const currentChunks = Array.from(
          document.querySelectorAll('script[src*=".chunk."]')
        )
          .map(s => s.src.split('/').pop())
          .sort()
          .join(',');

        const previousChunks = localStorage.getItem('react_build_chunks');

        if (previousChunks && previousChunks !== currentChunks) {
          console.log('New build detected — clearing old caches');

          // Clear the caches related to React, static files, and workbox
          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(
              names
                .filter(n =>
                  n.includes('react') ||
                  n.includes('static') ||
                  n.includes('workbox')
                )
                .map(n => caches.delete(n))
            );
          }
        }

        // Store the current chunk list for the next time
        localStorage.setItem('react_build_chunks', currentChunks);

        // Additional logic for cleaning up image cache
        const currentImageVersion = 'v2';

        // Check if the image version has changed and cleanup old images
        const previousImageVersion = localStorage.getItem('image_version');
        if (previousImageVersion && previousImageVersion !== currentImageVersion) {
          console.log('New image version detected — clearing old image cache');

          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(
              names
                .filter(n => n.includes('image') || n.includes('assets'))
                .map(n => caches.delete(n))
            );
          }
        }

        // Update the stored image version
        localStorage.setItem('image_version', currentImageVersion);

      } catch (e) {
        console.warn('Cache cleanup failed:', e);
      }
    })();
  </script>
